services:
  gui:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT to git rev-parse HEAD}
        USER_UID: ${AGENT_RULES_UID:-1000}
        USER_GID: ${AGENT_RULES_GID:-1000}
    ports:
      - "127.0.0.1:${AGENT_RULES_PORT:-8765}:${AGENT_RULES_PORT:-8765}"
    # scripts/gui.py reads these; unset values fall back to its defaults.
    environment:
      AGENT_RULES_WORKSPACE: ${AGENT_RULES_CONTAINER_WORKSPACE:-/workspace}
      AGENT_RULES_PORT: ${AGENT_RULES_PORT:-8765}
      AGENT_RULES_SHARED_URL: ${AGENT_RULES_SHARED_URL:-}
      AGENT_RULES_SOURCE_REF: ${AGENT_RULES_SOURCE_REF:-}
      AGENT_RULES_MAX_DEPTH: ${AGENT_RULES_MAX_DEPTH:-}
    init: true
    volumes:
      - type: bind
        source: ${AGENT_RULES_WORKSPACE:?Set AGENT_RULES_WORKSPACE to your repository parent folder}
        target: ${AGENT_RULES_CONTAINER_WORKSPACE:-/workspace}
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_RULES_BRIDGE_TOKEN:?Set AGENT_RULES_BRIDGE_TOKEN to the host bridge token file}
        target: /run/secrets/ai-bridge-token
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
